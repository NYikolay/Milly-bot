services:
  bot:
    build:
      context: .
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ "$${ENVIRONMENT}" = "production" ]; then
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${WEBHOOK_PORT:-8080}/health', timeout=3)"
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
